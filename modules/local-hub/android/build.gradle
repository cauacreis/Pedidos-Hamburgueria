plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.foodtruck.localhub'
version = '1.0.0'

expoModule {
  canBePublished = false
}

android {
  namespace "com.foodtruck.localhub"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "org.java-websocket:Java-WebSocket:1.5.7"
}
